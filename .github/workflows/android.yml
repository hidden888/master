name: Android CI

on:
  push:
    branches:
      - claude/app-rebuild-premium-2db2Z
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/*.apk streamdeck-tv-debug.apk

      - name: Upload debug APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-tv-debug
          path: streamdeck-tv-debug.apk
          if-no-files-found: error

      - name: Publish APK to rolling release (public download)
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-latest >/dev/null 2>&1 || \
            gh release create dev-latest \
              --prerelease \
              --title "StreamDeck TV – aktueller Test-Build" \
              --notes "Automatisch aus dem neuesten Build."
          gh release upload dev-latest streamdeck-tv-debug.apk --clobber
          gh release edit dev-latest --notes "Automatischer Build · Commit ${{ github.sha }} · $(date -u '+%Y-%m-%d %H:%M UTC')"
