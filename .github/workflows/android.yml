name: Android CI

on:
  push:
    branches:
      - claude/app-rebuild-premium-2db2Z
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/*.apk streamdeck-tv-debug.apk

      - name: Upload debug APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-tv-debug
          path: streamdeck-tv-debug.apk
          if-no-files-found: error

      - name: Publish APK to rolling release (public download)
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: StreamDeck TV – aktueller Test-Build
          body: |
            Automatisch aus dem neuesten Build erstellt.
            Commit: ${{ github.sha }}
          prerelease: true
          files: streamdeck-tv-debug.apk
